name: Upstream Release Check

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check for new openclaw release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.npm.outputs.version }}
      needs_build: ${{ steps.check.outputs.needs_build }}

    steps:
      - name: Get latest npm version
        id: npm
        run: |
          VERSION=$(curl -fsSL https://registry.npmjs.org/openclaw/latest | jq -r .version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest openclaw on npm: $VERSION"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.npm.outputs.version }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE already exists — skipping build."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE not found — triggering build."
          fi

  build:
    name: Build new release
    needs: check
    if: needs.check.outputs.needs_build == 'true'
    uses: ./.github/workflows/build.yaml
    with:
      openclaw_version: ${{ needs.check.outputs.version }}
    secrets: inherit
